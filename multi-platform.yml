name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    # mod.json only lists Windows (gd.win), so Windows is the only target.
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Win64
          # GD 2.2091 needs the Geode v6 SDK (pre-release for now).
          # Check that the action's `sdk` input accepts this tag; if the
          # build can't find the SDK, set it to `nightly`. The old bindings
          # pin and codegen-from-source flag for SDK 5.11.2 were removed.
          sdk: v6.0.0-alpha.1

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # When a version tag (v1.0.2, ...) is pushed, attach the CI-built .geode
      # to that tag's release, creating the release if needed. It never
      # overwrites a file that is already on the release.
      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
